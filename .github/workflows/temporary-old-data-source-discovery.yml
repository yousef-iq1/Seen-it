name: Temporary Seen It data migration
on:
  push:
    branches: [main]
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy legacy public catalog into new Supabase project
        shell: bash
        run: |
          set -euo pipefail
          fn="https://kieglzaewzqogevgraks.supabase.co/functions/v1/migrate-seen-it-data"
          result=$(curl -L -sS --fail --retry 4 --retry-all-errors --max-time 300 "$fn")
          echo "$result"
          echo "$result" | grep -q '"ok":true'
          base="https://kieglzaewzqogevgraks.supabase.co/storage/v1/object/public/seen-it-data"
          for file in catalog.json overviews.json; do
            code=$(curl -L -sS --retry 4 --retry-all-errors --max-time 180 -o /tmp/$file -w "%{http_code}" "$base/$file")
            bytes=$(wc -c < /tmp/$file)
            echo "$file STATUS=$code BYTES=$bytes"
            test "$code" = "200"
            test "$bytes" -gt 1000000
          done
